<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0E0E11"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF6363" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FF4B4B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#grid)"/>
  <circle cx="400" cy="225" r="280" fill="url(#glow)"/>
  
  <!-- Flow Diagram Card -->
  <g transform="translate(180, 110)">
    <rect width="440" height="230" rx="16" fill="#131318" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="440" height="40" rx="16" fill="#181820" fill-opacity="0.8"/>
    <circle cx="25" cy="20" r="4" fill="#FF5F56"/>
    <circle cx="40" cy="20" r="4" fill="#FFBD2E"/>
    <circle cx="55" cy="20" r="4" fill="#27C93F"/>
    <text x="75" y="24" fill="#71717A" font-family="system-ui, sans-serif" font-size="12" font-weight="500">n8n :: webhook-lead-pipeline.json</text>
    
    <!-- Flow steps inside -->
    <rect x="30" y="65" width="90" height="50" rx="8" fill="#1E1E28" stroke="#FF6363" stroke-opacity="0.5"/>
    <text x="75" y="90" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Webhook</text>
    <text x="75" y="104" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Form Lead</text>
    
    <!-- Arrow 1 -->
    <path d="M 120 90 L 150 90" stroke="#FF6363" stroke-width="2" stroke-dasharray="3 3"/>
    
    <rect x="155" y="65" width="105" height="50" rx="8" fill="#1E1E28" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="207" y="88" fill="#FF8E8E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">OpenAI LLM</text>
    <text x="207" y="102" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Draft Reply</text>
    
    <!-- Arrow 2 -->
    <path d="M 260 90 L 290 90" stroke="#FF6363" stroke-width="2" stroke-dasharray="3 3"/>
    
    <rect x="295" y="65" width="115" height="50" rx="8" fill="#1E1E28" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="352" y="88" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Google Sheets</text>
    <text x="352" y="102" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Append CRM</text>

    <!-- Bottom notification bar -->
    <rect x="30" y="145" width="380" height="55" rx="10" fill="#1A1A24" stroke="#27C93F" stroke-opacity="0.3"/>
    <circle cx="55" cy="172" r="10" fill="#27C93F" fill-opacity="0.2"/>
    <path d="M 50 172 L 53 176 L 60 168" stroke="#27C93F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="168" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Lead Qualified &amp; Alert Dispatched</text>
    <text x="75" y="186" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Executed autonomously in 3.8s · 0 human touchpoints</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="380" width="135" height="32" rx="16" fill="#181820" stroke="#FF6363" stroke-opacity="0.3"/>
  <circle cx="56" cy="396" r="4" fill="#FF6363"/>
  <text x="68" y="401" fill="#FF8E8E" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI Automation</text>
</svg>
