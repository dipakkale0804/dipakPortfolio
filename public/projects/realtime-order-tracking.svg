<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0E0E11"/>
  <defs>
    <radialGradient id="glow5" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1F1113" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#grid5)"/>
  <circle cx="400" cy="225" r="280" fill="url(#glow5)"/>
  
  <!-- Real-Time WebSocket Mockup -->
  <g transform="translate(170, 85)">
    <rect width="460" height="260" rx="16" fill="#131318" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="460" height="42" rx="16" fill="#191922" fill-opacity="0.9"/>
    <text x="24" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Order Dispatch Engine · Live WebSocket Sync</text>
    <circle cx="430" cy="21" r="5" fill="#22C55E"/>

    <!-- Order Timeline Visual -->
    <rect x="24" y="60" width="412" height="70" rx="10" fill="#181822" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <!-- Timeline line -->
    <line x1="60" y1="95" x2="350" y2="95" stroke="#22C55E" stroke-width="2"/>
    <line x1="250" y1="95" x2="350" y2="95" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Step 1 -->
    <circle cx="60" cy="95" r="10" fill="#22C55E"/>
    <path d="M 56 95 L 59 98 L 65 92" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="60" y="118" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Received</text>

    <!-- Step 2 -->
    <circle cx="160" cy="95" r="10" fill="#22C55E"/>
    <path d="M 156 95 L 159 98 L 165 92" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="160" y="118" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Preparing</text>

    <!-- Step 3 (Active) -->
    <circle cx="260" cy="95" r="12" fill="#EF4444" stroke="#FFA3A3" stroke-width="2"/>
    <circle cx="260" cy="95" r="4" fill="#FFFFFF"/>
    <text x="260" y="120" fill="#FFA3A3" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Out for Delivery</text>

    <!-- Step 4 -->
    <circle cx="360" cy="95" r="10" fill="#2A2A38"/>
    <text x="360" y="118" fill="#71717A" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Arrived</text>

    <!-- Code / Event Stream Terminal -->
    <rect x="24" y="145" width="412" height="90" rx="8" fill="#0C0C10" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="168" fill="#71717A" font-family="monospace" font-size="10">&gt; WebSocket connection established (STOMP /ws/orders/stream)</text>
    <text x="36" y="188" fill="#4ADE80" font-family="monospace" font-size="10">&gt; [BROADCAST 10:48:02] ORDER_STATUS_UPDATE: #ORD-9842 -&gt; OUT_FOR_DELIVERY</text>
    <text x="36" y="208" fill="#D4D4D8" font-family="monospace" font-size="10">&gt; Latency: 18ms · Spring Boot WebSockets + MySQL Persistent State</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="380" width="140" height="32" rx="16" fill="#181820" stroke="#EF4444" stroke-opacity="0.3"/>
  <circle cx="56" cy="396" r="4" fill="#EF4444"/>
  <text x="68" y="401" fill="#FFA3A3" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Backend &amp; APIs</text>
</svg>
