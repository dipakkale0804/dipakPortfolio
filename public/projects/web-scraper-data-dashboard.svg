<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0E0E11"/>
  <defs>
    <radialGradient id="glow3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#1F160E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#grid3)"/>
  <circle cx="400" cy="225" r="280" fill="url(#glow3)"/>
  
  <!-- Dashboard Analytics Mockup -->
  <g transform="translate(160, 90)">
    <rect width="480" height="250" rx="16" fill="#131318" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Top toolbar -->
    <rect x="0" y="0" width="480" height="42" rx="16" fill="#191922" fill-opacity="0.9"/>
    <text x="24" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Price Intelligence &amp; Trend Engine</text>
    <rect x="365" y="11" width="95" height="22" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="412" y="26" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Export .CSV</text>
    
    <!-- Mini Metric Cards -->
    <rect x="24" y="58" width="130" height="60" rx="8" fill="#1A1A24"/>
    <text x="36" y="78" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Products Monitored</text>
    <text x="36" y="103" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">14,820</text>
    
    <rect x="175" y="58" width="130" height="60" rx="8" fill="#1A1A24"/>
    <text x="187" y="78" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Competitor Delta</text>
    <text x="187" y="103" fill="#22C55E" font-family="system-ui, sans-serif" font-size="18" font-weight="700">-8.4%</text>

    <rect x="325" y="58" width="130" height="60" rx="8" fill="#1A1A24"/>
    <text x="337" y="78" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Scrape Health</text>
    <text x="337" y="103" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="18" font-weight="700">99.8%</text>

    <!-- Chart Line -->
    <rect x="24" y="132" width="432" height="98" rx="8" fill="#171720"/>
    <path d="M 40 200 C 90 190, 130 160, 180 170 C 230 180, 270 145, 330 155 C 380 165, 410 140, 440 145" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="440" cy="145" r="4" fill="#FBBF24"/>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="380" width="150" height="32" rx="16" fill="#181820" stroke="#F59E0B" stroke-opacity="0.3"/>
  <circle cx="56" cy="396" r="4" fill="#F59E0B"/>
  <text x="68" y="401" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Data &amp; Automation</text>
</svg>
